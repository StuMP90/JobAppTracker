name: Build and Release Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Windows Installer
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extract Release Version
        shell: pwsh
        run: |
          $raw = "${{ github.ref_name }}"
          $ver = if ($raw -match '^v?(\d+\.\d+\.\d+.*)$') { $matches[1] } else { "1.0.5" }
          echo "APP_VER=$ver" >> $env:GITHUB_ENV
          Write-Host "Configured release version: $ver"

      - name: Run Automated Verification Tests
        run: dotnet run --project Tests/JobAppTracker.Tests.csproj

      - name: Publish Self-Contained Application
        run: |
          dotnet publish JobAppTracker.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ env.APP_VER }} `
            --output "bin/Release/net8.0-windows/win-x64/publish"

      - name: Compile Windows Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer.iss
          options: /DMyAppVersion=${{ env.APP_VER }}

      - name: Build Windows Store MSIX Package
        shell: pwsh
        run: .\build-msix.ps1 -Version ${{ env.APP_VER }} -SkipTests

      # -------------------------------------------------------------
      # SIGNPATH CODE SIGNING (Uncomment after SignPath approval):
      # -------------------------------------------------------------
      # - name: Sign with SignPath Foundation
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
      #     organization-id: '${{ secrets.SIGNPATH_ORGANIZATION_ID }}'
      #     project-slug: 'JobAppTracker'
      #     signing-policy-slug: 'release-signing'
      #     artifact-configuration-slug: 'installer'
      #     parameters: |
      #       description: 'JobAppTracker Release ${{ github.ref_name }}'
      #     input-files-path: 'dist/JobAppTrackerSetup.exe'
      #     output-files-path: 'dist/JobAppTrackerSetup.exe'
      # -------------------------------------------------------------

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Release ${{ github.ref_name }}
          files: |
            dist/JobAppTrackerSetup.exe
            dist/JobAppTracker_*.msix
          draft: false
          prerelease: false
          generate_release_notes: true

      # -------------------------------------------------------------
      # AUTOMATED MICROSOFT STORE PUBLISHING:
      # Automatically uploads and submits new MSIX packages to Partner
      # Center when MSSTORE_CLIENT_SECRET is configured in GitHub Secrets.
      # -------------------------------------------------------------
      - name: Publish to Microsoft Store
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSSTORE_PRODUCT_ID: ${{ secrets.MSSTORE_PRODUCT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MSSTORE_CLIENT_SECRET)) {
            Write-Host "MSSTORE_CLIENT_SECRET is not configured in GitHub Secrets. Skipping Microsoft Store upload."
            exit 0
          }

          Write-Host "Installing Microsoft Store Developer CLI..."
          winget install "Microsoft Store Developer CLI" --accept-package-agreements --accept-source-agreements --silent
          
          # Refresh environment PATH for current session
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          
          Write-Host "Configuring Store credentials..."
          msstore reconfigure --tenantId $env:MSSTORE_TENANT_ID --clientId $env:MSSTORE_CLIENT_ID --clientSecret $env:MSSTORE_CLIENT_SECRET
          
          $msix = Get-ChildItem -Path "dist\JobAppTracker_*.msix" | Select-Object -First 1
          Write-Host "Publishing $($msix.Name) to Microsoft Store..."
          msstore publish --productId $env:MSSTORE_PRODUCT_ID --inputFile $msix.FullName

